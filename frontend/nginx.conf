server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # SPA fallback so client-side routes work on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
